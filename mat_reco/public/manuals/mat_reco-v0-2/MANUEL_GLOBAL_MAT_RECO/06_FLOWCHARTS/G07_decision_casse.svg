<text text-anchor="middle" font-family="Arial,sans-serif" fill="#193b55" font-weight="400" font-size="16" x="640.0" y="1330"><tspan x="640.0" dy="0">Une casse successive n’est ni une deuxième demande client ni une suppression des événements antérieurs.</tspan></text></svg>