<text text-anchor="middle" font-family="Arial,sans-serif" fill="#193b55" font-weight="400" font-size="17" x="640.0" y="75"><tspan x="640.0" dy="0">A15 / A19 / A24 / A25 · Déclarer, enregistrer, recontrôler, remplacer.</tspan></text>
